</style></head><body><header>H ▪ Hotel Bookings Quiz <span style="float:right;color:#8292a5;font-size:12px">VISUALISASI DATA</span></header><main id="app"></main><div class="foot">25 soal dari dataset hotel_bookings_16mb.csv · Universitas Yudharta Pasuruan</div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>const Q=[["Berapa jumlah baris data pemesanan hotel ini?",["119.390","32.000","79.330","40.060"],20,0],["Berapa jumlah kolom pada dataset ini?",["30","31","32","33"],20,2],["Tahun kedatangan apa saja yang ada dalam dataset?",["2016-2018","2015-2017","2014-2016","2017-2019"],20,1],["Apa arti nilai is_canceled = 1?",["Pesanan selesai","Tamu berulang","Pesanan dibatalkan","Pesanan baru"],20,2],["Kolom mana yang membedakan City Hotel dan Resort Hotel?",["hotel","meal","country","customer_type"],20,0],["Apa makna lead_time pada dataset ini?",["Lama menginap","Jeda pesan ke kedatangan","Harga kamar","Jumlah tamu"],30,1],["Apa yang dimaksud kolom adr?",["Jumlah tamu dewasa","Kode agen","Tarif rata-rata harian","Jumlah kamar"],30,2],["Jika is_repeated_guest = 1, apa artinya?",["Tamu berulang","Kamar diganti","Pesanan dibatalkan","Pesanan grup"],20,0],["Jenis hotel mana dengan jumlah pemesanan lebih besar?",["Resort Hotel","Keduanya sama","City Hotel","Tidak diketahui"],20,2],["Ada berapa pemesanan City Hotel?",["40.060","75.166","44.224","79.330"],30,3],["Berapa banyak pemesanan yang dibatalkan?",["44.224","75.166","40.060","79.330"],30,0],["Persentase pembatalan seluruh pemesanan paling dekat ke...",["17%","27%","37%","57%"],30,2],["Hotel dengan tingkat pembatalan lebih tinggi adalah...",["Resort Hotel","City Hotel","Sama besar","Tak bisa dihitung"],30,1],["Tahun dengan jumlah pemesanan terbanyak adalah...",["2015","2016","2017","Sama banyak"],20,1],["Bulan kedatangan teramai jika semua tahun digabung adalah...",["Juli","Mei","Oktober","Agustus"],30,3],["Bulan kedatangan tersedikit jika semua tahun digabung adalah...",["Januari","Desember","November","Februari"],30,0],["Segmen pasar dengan pemesanan terbanyak adalah...",["Direct","Groups","Online TA","Corporate"],30,2],["Kode negara asal tamu yang paling sering muncul adalah...",["GBR","FRA","ESP","PRT"],30,3],["Kategori meal dengan frekuensi tertinggi adalah...",["BB","HB","FB","SC"],20,0],["Kolom mana yang memiliki nilai NULL paling banyak?",["country","children","company","hotel"],30,2],["Berapakah median lead_time seluruh pemesanan?",["14 hari","69 hari","104 hari","365 hari"],30,1],["Grafik tepat untuk membandingkan total City vs Resort Hotel?",["Scatter plot","Line chart","Histogram","Bar chart"],20,3],["Grafik terbaik untuk tren jumlah kedatangan dari bulan ke bulan?",["Line chart","Pie chart","Box plot","Scatter plot"],20,0],["Grafik apa untuk melihat hubungan lead_time dan adr?",["Pie chart","Stacked bar","Scatter plot","Donut chart"],30,2],["Grafik mana untuk melihat sebaran dan outlier nilai adr?",["Pie chart","Box plot","Area chart","Donut chart"],30,1]];
const app=document.getElementById('app'),sq=['▲','◆','●','■'];let role='',peer=null,conn=null,others={},players={},room='',title='Hotel Bookings Quiz',phase='lobby',step=-1,maxQ=25,until=0,answers={},timer=null,studName='',myAnswer=null,myScore=0,board=[],demoStep=0,demoN=5,demoScore=0,demoCorrect=0,demoDeadline=0,demoDone=false;
function x(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('id-ID')}
function html(s){app.innerHTML=s}
function click(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}
function link(){return location.href.split('?')[0].split('#')[0]}
function toast(t){alert(t)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function btn(id,text,cl){return '<button class="btn '+(cl||'')+'" id="'+id+'">'+text+'</button>'}
function options(a,off,selected,correct){return '<div class="opts">'+a.map((s,i)=>'<button '+(off?'disabled ':'')+'class="opt '+(selected===i?'chosen ':'')+(correct===i?'correct ':'')+(correct!=null&&correct!==i?'wrong ':'')+'" data-a="'+i+'"><b>'+sq[i]+'</b><span>'+x(s)+'</span></button>').join('')+'</div>'}
function rank(max){return Object.values(players).sort((a,b)=>b.score-a.score||b.good-a.good||a.name.localeCompare(b.name,'id')).slice(0,max||30)}
function boardHtml(list){return list.length?list.map((p,i)=>'<div class="leader"><span class="pos">'+(i+1)+'</span><span><b>'+x(p.name)+'</b></span><strong class="score">'+fmt(p.score)+'</strong></div>').join(''):'<p>Belum ada peserta.</p>'}
function home(){role='home';stop();html('<div class="cap">Kuis interaktif 25 soal</div><h1>Belajar data, sambil bermain.</h1><p>Soal pilihan ganda mengenai dataset Hotel Bookings. Bermain dari HP tanpa akun mahasiswa.</p><div class="grid"><div class="card tile"><h2>🎓 Untuk dosen</h2><p>Buat sesi, bagikan link, jalankan soal, dan pantau peringkat kelas.</p>'+btn('host','Buat sesi kelas')+'</div><div class="card tile"><h2>📱 Untuk mahasiswa</h2><p>Gabung dengan kode atau link kelas dan jawab soal dari HP.</p>'+btn('join','Gabung kuis','alt')+'</div><div class="card tile"><h2>⚡ Uji coba</h2><p>Coba 5 soal atau mainkan seluruh 25 soal secara mandiri.</p>'+btn('demo','Mulai uji coba','green')+'</div></div><div class="warn">Mode kelas memakai koneksi langsung antarbrowser (WebRTC). Dosen harus mempertahankan tab selama kuis; koneksi 30 mahasiswa perlu diuji pada jaringan kampus.</div>');click('host',hostForm);click('join',()=>joinForm(''));click('demo',demoForm)}
function demoForm(){role='demoform';html('<div class="cap">Mode uji coba</div><h1>Coba kuis mandiri</h1><div class="card"><label>Jumlah pertanyaan</label><select id="dn"><option value="5">5 soal — uji cepat</option><option value="10">10 soal</option><option value="25">25 soal lengkap</option></select><p>Jawaban, skor, dan penjelasan benar muncul setelah menjawab.</p><div class="row">'+btn('ds','Mulai sekarang','green')+btn('back','Kembali','alt')+'</div></div>');click('ds',()=>{demoN=Number(document.getElementById('dn').value);demoStep=0;demoScore=0;demoCorrect=0;demoQuestion()});click('back',home)}
function demoQuestion(){stop();role='demo';demoDone=false;if(demoStep>=demoN){demoFinish();return}var q=Q[demoStep];demoDeadline=Date.now()+q[2]*1000;html('<div class="between"><span class="pill">Uji coba</span><b>Soal '+(demoStep+1)+' / '+demoN+'</b></div><div class="card"><div class="between"><span class="small">Pilih jawaban benar</span><span id="seconds" class="clock">'+q[2]+'</span></div><div class="big">'+x(q[0])+'</div><div id="opts">'+options(q[1],false,null,null)+'</div></div><p>Skor: <strong>'+fmt(demoScore)+'</strong></p>');app.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>demoAnswer(Number(e.dataset.a)));timer=setInterval(()=>{var t=Math.max(0,Math.ceil((demoDeadline-Date.now())/1000));var e=document.getElementById('seconds');if(e)e.textContent=t;if(t<=0)demoAnswer(-1)},180)}
function demoAnswer(a){if(demoDone)return;demoDone=true;stop();var q=Q[demoStep],yes=a===q[3],pts=yes?Math.round(500+500*Math.max(0,(demoDeadline-Date.now())/(q[2]*1000))):0;demoScore+=pts;if(yes)demoCorrect++;document.getElementById('opts').innerHTML=options(q[1],true,a,q[3]);app.insertAdjacentHTML('beforeend','<div class="card"><h2>'+(yes?'✅ Tepat!':'Jawaban yang benar')+'</h2><p><b>'+x(q[1][q[3]])+'</b></p><p>+'+fmt(pts)+' poin</p>'+btn('next',demoStep+1===demoN?'Lihat hasil':'Soal berikutnya','green')+'</div>');click('next',()=>{demoStep++;demoQuestion()})}
function demoFinish(){stop();html('<div class="card center"><div class="trophy">🏆</div><h1>Uji coba selesai!</h1><div class="total">'+fmt(demoScore)+'</div><p>Total poin • '+demoCorrect+' benar dari '+demoN+' soal</p>'+btn('again','Ulangi','green')+' '+btn('back','Beranda','alt')+'</div>');click('again',demoForm);click('back',home)}
function hostForm(){role='hostform';html('<div class="cap">Dashboard dosen</div><h1>Buat sesi kelas</h1><div class="card"><label>Judul sesi</label><input id="title" maxlength="65" value="Hotel Bookings — Visualisasi Data"><label>Jumlah soal</label><select id="count"><option value="25">25 soal lengkap</option><option value="10">10 soal</option><option value="5">5 soal untuk uji</option></select><p class="warn">Pastikan koneksi internet dosen stabil dan tab ini tetap terbuka selama permainan.</p><div class="row">'+btn('make','Buat ruang sekarang')+btn('back','Kembali','alt')+'</div><p id="state" class="small"></p></div>');click('back',home);click('make',makeHost)}
function makeHost(){if(typeof Peer!=='function'){toast('Koneksi WebRTC belum siap. Cek koneksi internet dan muat ulang.');return}title=document.getElementById('title').value||'Hotel Bookings Quiz';maxQ=Number(document.getElementById('count').value);room='hb-'+Array.from(crypto.getRandomValues(new Uint8Array(5)),n=>n.toString(16).padStart(2,'0')).join('');players={};others={};answers={};step=-1;phase='lobby';document.getElementById('state').textContent='Membuka ruang...';document.getElementById('make').disabled=true;peer=new Peer(room);peer.on('open',()=>{role='host';hostPage()});peer.on('error',e=>{toast('Gagal membuat ruang: '+(e.type||e.message));if(role==='hostform')hostForm()});peer.on('connection',c=>{others[c.peer]=c;c.on('data',msg=>hostData(c,msg));c.on('close',()=>{if(players[c.peer])players[c.peer].online=false;delete others[c.peer];if(role==='host')hostPage()});c.on('open',()=>{c.send({k:'hello'})})})}
function hostData(c,m){if(!m||typeof m!=='object')return;if(m.k==='join'){var name=String(m.name||'').trim().slice(0,35);if(!name)return;if(!players[c.peer])players[c.peer]={name,score:0,good:0,online:true,history:[]};else players[c.peer].online=true;sync(c);hostPage()}if(m.k==='answer'&&phase==='question'&&Number(m.step)===step&&!answers[c.peer]&&players[c.peer]&&Date.now()<=until+250){var a=Number(m.answer);if(!Number.isInteger(a)||a<0||a>3)return;var good=a===Q[step][3],pts=good?Math.round(500+500*Math.max(0,(until-Date.now())/(Q[step][2]*1000))):0;answers[c.peer]=true;players[c.peer].score+=pts;players[c.peer].good+=Number(good);players[c.peer].history.push([step+1,a,good,pts]);c.send({k:'ack'});hostPage();var count=Object.values(players).filter(p=>p.online).length;if(Object.keys(answers).length>=count)setTimeout(reveal,500)}}
function sendAll(m){Object.values(others).forEach(c=>{if(c.open)try{c.send(m)}catch(e){}})}
function sync(c){if(!c.open)return;var p=players[c.peer];c.send({k:'sync',phase,step,maxQ,score:p?p.score:0,leader:rank(10),q:phase==='question'?{text:Q[step][0],options:Q[step][1],time:Q[step][2],until,step}:null,correct:phase==='reveal'?Q[step][3]:null})}
function startQuestion(){stop();if(step+1>=maxQ){endHost();return}phase='question';step++;answers={};until=Date.now()+Q[step][2]*1000;sendAll({k:'question',step,maxQ,q:{text:Q[step][0],options:Q[step][1],time:Q[step][2],until,step}});hostPage();timer=setInterval(()=>{var e=document.getElementById('seconds');if(e)e.textContent=Math.max(0,Math.ceil((until-Date.now())/1000));if(Date.now()>=until)reveal()},180)}
function reveal(){if(phase!=='question')return;stop();phase='reveal';sendAll({k:'reveal',step,correct:Q[step][3],leader:rank(10)});hostPage()}
function endHost(){stop();phase='finished';sendAll({k:'end',leader:rank(99)});hostPage()}
function exportCsv(){var data=[['Rank','Nama','Skor','Benar','Jumlah Soal','Jawaban']].concat(rank(999).map((p,i)=>[i+1,p.name,p.score,p.good,maxQ,p.history.map(h=>h[0]+':'+(h[2]?'Benar':'Salah')+'('+h[3]+')').join(' | ')]));var text='\ufeff'+data.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='Nilai_Hotel_Bookings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function hostPage(){if(role!=='host')return;var list=rank(99),how=Object.values(players).filter(p=>p.online).length;var center='';if(phase==='lobby')center='<div class="card"><div class="between"><h2>Lobi kelas</h2><span class="pill ok">Terbuka</span></div><div class="stats"><div><strong>'+list.length+'</strong><small>Peserta</small></div><div><strong>'+how+'</strong><small>Online</small></div><div><strong>'+maxQ+'</strong><small>Soal</small></div></div><p>Peserta:</p><div class="people">'+(list.length?list.map(p=>'<em>'+x(p.name)+'</em>').join(''):'<span class="muted">Belum ada mahasiswa</span>')+'</div><p></p>'+btn('start','Mulai permainan','green')+'</div>';if(phase==='question'){var q=Q[step];center='<div class="card"><div class="between"><span class="pill">Soal '+(step+1)+' / '+maxQ+'</span><span class="clock" id="seconds">'+Math.max(0,Math.ceil((until-Date.now())/1000))+'</span></div><div class="big">'+x(q[0])+'</div>'+options(q[1],true,null,null)+'<p>'+Object.keys(answers).length+' dari '+how+' peserta telah menjawab</p>'+btn('reveal','Tampilkan jawaban','ghost')+'</div>'}if(phase==='reveal'){var q=Q[step];center='<div class="card"><span class="pill ok">Hasil soal '+(step+1)+'</span><div class="big">'+x(q[0])+'</div>'+options(q[1],true,null,q[3])+'<p class="info">Jawaban benar: <b>'+x(q[1][q[3]])+'</b></p>'+btn('next',step+1===maxQ?'Lihat hasil akhir':'Soal berikutnya','green')+'</div>'}if(phase==='finished')center='<div class="card center"><div class="trophy">🏆</div><h1>Kuis selesai!</h1><p>Juara pertama</p><div class="total">'+x(list.length?list[0].name:'—')+'</div><p>'+fmt(list.length?list[0].score:0)+' poin</p>'+btn('dl','Unduh nilai CSV','green')+' '+btn('reset','Main lagi','alt')+'</div>';var share=link()+'?room='+room;html('<div class="between"><div><div class="cap">Dashboard dosen</div><h1>'+x(title)+'</h1></div><span class="pill ok">'+x(phase)+'</span></div><div class="two"><section>'+center+'<div class="card"><h3>Link untuk mahasiswa</h3><div class="link">'+x(share)+'</div><div class="row">'+btn('copy','Salin link','alt')+btn('code','Salin kode','ghost')+'</div><p class="small">Kode: <b>'+x(room)+'</b>. Tab dosen harus tetap terbuka.</p></div></section><aside><div class="card"><h2>Leaderboard</h2>'+boardHtml(rank(10))+'</div><div class="card"><h3>Rekap</h3><p>'+list.length+' peserta · '+how+' online</p>'+btn('export','Unduh nilai CSV','ghost')+'</div></aside></div><div class="warn">Catatan: mode kelas memakai PeerJS Cloud dan koneksi WebRTC gratis. Untuk 30 HP, lakukan uji pada jaringan yang akan dipakai. Bukan untuk ujian resmi berisiko tinggi.</div>');click('start',startQuestion);click('next',startQuestion);click('reveal',reveal);click('dl',exportCsv);click('export',exportCsv);click('reset',()=>{for(var id in players){players[id].score=0;players[id].good=0;players[id].history=[]}step=-1;phase='lobby';Object.values(others).forEach(sync);hostPage()});click('copy',()=>copy(share));click('code',()=>copy(room))}
function copy(s){if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>toast('Berhasil disalin')).catch(()=>prompt('Salin:',s));else prompt('Salin:',s)}
function joinForm(r){role='joinform';html('<div class="cap">Untuk mahasiswa</div><h1>Gabung kuis kelas</h1><div class="card"><label>Nama peserta</label><input id="name" maxlength="35" placeholder="Nama mahasiswa"><label>Kode ruang</label><input id="room" value="'+x(r||'')+'" placeholder="hb-xxxxxxxxxx"><p></p><div class="row">'+btn('go','Gabung sekarang','green')+btn('back','Beranda','alt')+'</div><p class="small" id="state"></p></div>');click('back',home);click('go',joinHost)}
function joinHost(){studName=document.getElementById('name').value.trim().slice(0,35);room=document.getElementById('room').value.trim();if(!studName){toast('Isi nama dulu');return}if(!/^hb-[a-f0-9]{10}$/.test(room)){toast('Kode ruang tidak valid');return}if(typeof Peer!=='function'){toast('Koneksi WebRTC tidak tersedia. Cek internet.');return}document.getElementById('state').textContent='Menghubungkan...';document.getElementById('go').disabled=true;peer=new Peer();peer.on('open',()=>{conn=peer.connect(room,{reliable:true});conn.on('open',()=>{role='student';conn.send({k:'join',name:studName});waiting()});conn.on('data',studentData);conn.on('close',()=>{role='offline';html('<div class="card"><h2>Koneksi terputus</h2><p>Periksa internet, lalu masuk kembali melalui link kelas.</p>'+btn('back','Beranda','alt')+'</div>');click('back',home)})});peer.on('error',e=>{toast('Gagal terhubung: '+(e.type||e.message));joinForm(room)})}
function waiting(){stop();html('<div class="card center"><div class="trophy">👋</div><h1>Halo, '+x(studName)+'!</h1><p>Terhubung ke ruang '+x(room)+'. Menunggu dosen memulai atau melanjutkan kuis.</p><div class="total">'+fmt(myScore)+'</div><p>Poin sementara</p></div>')}
function studentData(m){if(!m||typeof m!=='object')return;if(m.k==='sync'){myScore=m.score||0;board=m.leader||[];if(m.phase==='question'&&m.q)studentQuestion(m.q,m.maxQ);else if(m.phase==='reveal')studentReveal(m.step,m.correct,m.leader);else if(m.phase==='finished')studentEnd(m.leader);else waiting()}if(m.k==='question')studentQuestion(m.q,m.maxQ);if(m.k==='ack'){var e=document.getElementById('status');if(e)e.textContent='Jawaban diterima dosen ✓'}if(m.k==='reveal')studentReveal(m.step,m.correct,m.leader);if(m.k==='end')studentEnd(m.leader)}
function studentQuestion(q,max){stop();role='student';myAnswer=null;html('<div class="between"><span class="pill ok">Terhubung · '+x(studName)+'</span><b>Soal '+(q.step+1)+' / '+max+'</b></div><div class="card"><div class="between"><span class="muted">Pilih jawabanmu</span><span class="clock" id="seconds">'+q.time+'</span></div><div class="big">'+x(q.text)+'</div><div id="choices">'+options(q.options,false,null,null)+'</div></div><div class="between"><p id="status">Belum menjawab</p><strong>'+fmt(myScore)+' poin</strong></div>');app.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{if(myAnswer!==null||Date.now()>q.until)return;myAnswer=Number(e.dataset.a);document.getElementById('choices').innerHTML=options(q.options,true,myAnswer,null);document.getElementById('status').textContent='Mengirim jawaban...';if(conn&&conn.open)conn.send({k:'answer',step:q.step,answer:myAnswer})});timer=setInterval(()=>{var t=Math.max(0,Math.ceil((q.until-Date.now())/1000)),e=document.getElementById('seconds');if(e)e.textContent=t;if(t<=0){stop();if(myAnswer===null){document.getElementById('choices').innerHTML=options(q.options,true,null,null);document.getElementById('status').textContent='Waktu habis'}}},180)}
function studentReveal(step,correct,leaders){stop();board=leaders||board;var me=board.find(p=>p.name===studName);if(me)myScore=me.score;var q=Q[step];html('<div class="card"><span class="pill ok">Pembahasan soal '+(step+1)+'</span><div class="big">'+x(q[0])+'</div>'+options(q[1],true,null,correct)+'<div class="info">Jawaban benar: <b>'+x(q[1][correct])+'</b></div><p>Menunggu soal berikutnya...</p></div><div class="card"><h2>Skor: '+fmt(myScore)+'</h2><h3>Leaderboard sementara</h3>'+boardHtml(board.slice(0,10))+'</div>')}
function studentEnd(leaders){stop();board=leaders||board;var pos=board.findIndex(p=>p.name===studName)+1;var me=board.find(p=>p.name===studName);if(me)myScore=me.score;html('<div class="card center"><div class="trophy">🏆</div><h1>Terima kasih, '+x(studName)+'!</h1><div class="total">'+fmt(myScore)+'</div><p>Peringkat '+(pos||'—')+' dari '+board.length+' peserta</p></div><div class="card"><h2>Peringkat akhir</h2>'+boardHtml(board)+'</div>')}
window.addEventListener('beforeunload',e=>{if(role==='host'&&phase!=='finished'){e.preventDefault();e.returnValue=''}});var query=new URLSearchParams(location.search);if(query.has('room'))joinForm(query.get('room'));else if(query.has('demo'))demoForm();else if(query.has('host'))hostForm();else home();
</script></body></html>
